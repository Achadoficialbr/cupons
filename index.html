<html lang="pt-BR">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #FFE600;
      --yellow-dark: #E6CF00;
      --blue: #0A0080;
      --blue-mid: #1A0099;
      --white: #FFFFFF;
      --bg: #F7F7F7;
      --text: #1A1A1A;
      --muted: #666;
      --border: #E8E8E8;
      --green: #00A650;
      --red: #E8003C;
      --orange: #FF6000;
      --radius-pill: 50px;
      --radius-card: 14px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', Arial, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* HEADER */
    .hdr { background: var(--yellow); padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .hdr-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .hdr-pill { background: var(--blue); color: var(--yellow); font-size: 13px; font-weight: 900; padding: 6px 16px; border-radius: var(--radius-pill); }
    .hdr-sub { font-size: 12px; font-weight: 700; color: var(--blue); opacity: .75; text-transform: uppercase; letter-spacing: .06em; }
    .hdr-social { font-size: 11px; font-weight: 800; color: var(--blue); text-decoration: none; border: 2px solid var(--blue); padding: 5px 12px; border-radius: 50px; transition: 0.2s; }
    .hdr-social:hover { background: var(--blue); color: var(--yellow); }

    /* HERO */
    .hero { background: var(--blue); padding: 32px 20px 28px; }
    .hero-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .hero-left h1 { font-size: clamp(22px,3.5vw,36px); font-weight: 900; color: var(--white); line-height: 1.15; }
    .hero-left h1 span { color: var(--yellow); }
    .hero-left p { font-size: 13px; color: rgba(255,255,255,.7); margin-top: 6px; font-weight: 600; }
    .hero-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .hero-stat { background: rgba(255,255,255,.08); border: 1.5px solid rgba(255,230,0,.25); border-radius: var(--radius-pill); padding: 8px 16px; display: flex; flex-direction: column; align-items: center; }
    .hero-stat-n { font-size: 22px; font-weight: 900; color: var(--yellow); line-height: 1; }
    .hero-stat-l { font-size: 9px; font-weight: 700; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: .08em; }

    /* TOOLBAR */
    .toolbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 20px; position: sticky; top: 64px; z-index: 90; }
    .toolbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .filter-btn { background: var(--white); border: 2px solid var(--border); color: var(--muted); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: var(--radius-pill); cursor: pointer; transition: all .15s; white-space: nowrap; }
    .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active { background: var(--blue); border-color: var(--blue); color: var(--yellow); }
    .search { margin-left: auto; padding: 8px 16px; border: 2px solid var(--border); border-radius: var(--radius-pill); font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; outline: none; width: 220px; }
    .search:focus { border-color: var(--blue); }

    /* LIST */
    .list-wrap { max-width: 1100px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

    /* CARD COM CUPOM OCULTO E RESGATE */
    .card { background: var(--white); border-radius: var(--radius-card); border: 1.5px solid var(--border); display: grid; grid-template-columns: 105px 1fr 165px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .card.site { border-left: 5px solid var(--green); }
    .card.hoje { border-left: 5px solid var(--red); }
    .card.breve { border-left: 5px solid var(--orange); }

    .card-badge { background: var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    .card.hoje .card-badge { background: var(--red); }
    .card.site .card-badge { background: var(--green); }
    .badge-n { font-size: 32px; font-weight: 900; color: var(--yellow); line-height: 1; }
    .card.hoje .badge-n, .card.site .badge-n { color: var(--white); }
    .badge-unit { font-size: 12px; font-weight: 800; color: rgba(255,230,0,.8); }
    .card.hoje .badge-unit, .card.site .badge-unit { color: rgba(255,255,255,.8); }

    .card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .coupon-name { font-size: 18px; font-weight: 900; color: var(--text); letter-spacing: .02em; }
    .coupon-name.oculto { filter: blur(4px); user-select: none; background: #EEE; border-radius: 4px; padding: 0 4px; }
    
    .pill-tag { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: var(--radius-pill); text-transform: uppercase; }
    .pill-site { background: #E6F9EE; color: var(--green); }
    .pill-cat { background: #EFEFFF; color: var(--blue); }
    .pill-hot { background: #FFF0E6; color: var(--orange); }
    .pill-expira { background: #FFE6EC; color: var(--red); }

    .card-nums { display: flex; gap: 16px; flex-wrap: wrap; }
    .num-item { display: flex; flex-direction: column; }
    .num-label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
    .num-val { font-size: 14px; font-weight: 800; color: var(--text); }
    .num-val.green { color: var(--green); }

    .card-footer { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--muted); }

    /* ACTION BUTTON (CLICK TO REVEAL) */
    .card-action { padding: 16px; display: flex; align-items: center; justify-content: center; border-left: 1px solid var(--border); background: #FAFAFA; }
    .btn-resgatar {
      background: var(--yellow); border: none; border-radius: var(--radius-pill); padding: 12px 14px;
      font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 900; color: var(--blue);
      cursor: pointer; transition: 0.15s; width: 100%; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .btn-resgatar:hover { background: var(--yellow-dark); transform: scale(1.02); }
    .btn-resgatar.copiado { background: var(--green); color: #fff; }

    .empty { text-align: center; padding: 48px 20px; color: var(--muted); font-size: 14px; font-weight: 700; background: var(--white); border-radius: var(--radius-card); display: none; }
    .empty.show { display: block; }
    .footer { text-align: center; padding: 24px; font-size: 12px; font-weight: 600; color: var(--muted); }

    @media (max-width: 768px) {
      .card { grid-template-columns: 80px 1fr; }
      .card-action { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--border); padding: 10px 16px; }
      .search { width: 100%; margin-left: 0; margin-top: 6px; }
      .badge-n { font-size: 24px; }
    }
  </style>
</head>

// Injeta seu parâmetro de afiliado em qualquer URL de lista
function comissionar(urlOriginal) {
  if (!urlOriginal || urlOriginal === "#") {
    urlOriginal = "https://www.mercadolivre.com.br/";
  }
  const separador = urlOriginal.includes('?') ? '&' : '?';
  return `${urlOriginal}${separador}matt_tool=${MATT_TOOL}&matt_word=${MATT_WORD}&forceInApp=true`;
}

function dl(s){
  const[d,m,y]=s.split('/').map(Number);
  return Math.round((new Date(y,m-1,d)-new Date(new Date().toDateString()))/86400000);
}

function expInfo(c){
  const d=dl(c.dia_fim);
  if(d<0)return{l:'Expirado',cls:''};
  if(d===0)return{l:'Expira hoje',cls:'hoje'};
  if(d<=3)return{l:d+'d restantes',cls:'breve'};
  return{l:'Válido até '+c.dia_fim,cls:'ok'};
}

function cat(a){
  if(/fashion/i.test(a))return'Moda';
  if(/furnishing|houseware|furniture|living|dining/i.test(a))return'Casa e Decoração';
  if(/sellers/i.test(a))return'Seleção Vendedores';
  if(/mar aberto/i.test(a))return'Outros';
  return a || 'Outros';
}

function cardCls(c){
  if(c.is_mar_aberto)return'site';
  const d=dl(c.dia_fim);
  if(d===0)return'hoje';
  if(d<=3)return'breve';
  return'';
}

let af='all', sq='';

function matches(c){
  if(af==='mar'&&!c.is_mar_aberto)return false;
  if(af==='Moda'&&cat(c.acao)!=='Moda')return false;
  if(af==='Casa'&&cat(c.acao)!=='Casa e Decoração')return false;
  if(af==='Sellers'&&cat(c.acao)!=='Seleção Vendedores')return false;
  if(af==='Outros'){
    const knownCats=['Moda','Casa e Decoração','Seleção Vendedores'];
    if(c.is_mar_aberto||knownCats.includes(cat(c.acao)))return false;
  }
  if(sq){
    const q=sq.toLowerCase();
    return c.nome.toLowerCase().includes(q)||(c.container_name||'').toLowerCase().includes(q)||(c.acao||'').toLowerCase().includes(q);
  }
  return true;
}

function renderCard(c, index){
  const exp=expInfo(c), cls=cardCls(c);
  const catLabel=c.is_mar_aberto?'Todo o site':cat(c.acao);
  const catCls=c.is_mar_aberto?'pill-site':'pill-cat';
  const hotTag=(!c.is_reais && c.discount_num>=25)?'<span class="pill-tag pill-hot">🔥 Destaque</span>':'';
  const expTag=cls==='hoje'||cls==='breve'?`<span class="pill-tag pill-expira">${exp.l}</span>`:'';
  const badgeUnit=c.is_reais?'R$ OFF':'% OFF';
  const linkDestino = comissionar(c.container_url);

  return `
  <div class="card ${cls}">
    <div class="card-badge">
      <div class="badge-n">${c.discount_num}</div>
      <div class="badge-unit">${badgeUnit}</div>
    </div>
    <div class="card-body">
      <div class="card-top">
        <span class="coupon-name oculto" id="code-${index}">${c.nome.substring(0, 3)}••••</span>
        <span class="pill-tag ${catCls}">${catLabel}</span>
        ${hotTag}${expTag}
      </div>
      <div class="card-nums">
        <div class="num-item"><span class="num-label">Desconto</span><span class="num-val green">${c.valor_desconto}</span></div>
        <div class="num-item"><span class="num-label">Mínimo</span><span class="num-val">R$${c.min_compra}</span></div>
        <div class="num-item"><span class="num-label">Desconto Máx.</span><span class="num-val">R$${c.desconto_max}</span></div>
      </div>
      <div class="card-footer">
        <span>📅 ${c.dia_inicio} até ${c.dia_fim}</span>
      </div>
    </div>
    <div class="card-action">
      <button class="btn-resgatar" id="btn-${index}" onclick="resgatarCupom(${index}, '${c.nome}', '${linkDestino}')">
        Pegar Cupom
      </button>
    </div>
  </div>`;
}

function resgatarCupom(idx, codigo, urlFinal) {
  // 1. Copia o código para a área de transferência
  if (navigator.clipboard) {
    navigator.clipboard.writeText(codigo);
  } else {
    const e = document.createElement('textarea');
    e.value = codigo;
    document.body.appendChild(e);
    e.select();
    document.execCommand('copy');
    e.remove();
  }

  // 2. Revela o código
  const el = document.getElementById(`code-${idx}`);
  if (el) {
    el.textContent = codigo;
    el.classList.remove('oculto');
  }

  // 3. Atualiza o botão
  const btn = document.getElementById(`btn-${idx}`);
  if (btn) {
    btn.textContent = '✓ Copiado!';
    btn.classList.add('copiado');
  }

  // 4. Abre a lista do cupom com o seu link comissionado
  window.open(urlFinal, '_blank');
}

function counts(){
  const n=COUPONS;
  document.getElementById('c-all').textContent=n.length;
  document.getElementById('c-mar').textContent=n.filter(c=>c.is_mar_aberto).length;
  document.getElementById('c-fas').textContent=n.filter(c=>cat(c.acao)==='Moda').length;
  document.getElementById('c-furn').textContent=n.filter(c=>cat(c.acao)==='Casa e Decoração').length;
  document.getElementById('c-sel').textContent=n.filter(c=>cat(c.acao)==='Seleção Vendedores').length;
  document.getElementById('c-out').textContent=n.filter(c=>{
    const knownCats=['Moda','Casa e Decoração','Seleção Vendedores'];
    return !c.is_mar_aberto && !knownCats.includes(cat(c.acao));
  }).length;
  
  const maxD=n.length?Math.max(...n.map(c=>c.discount_num)):0;
  const hoje=n.filter(c=>dl(c.dia_fim)===0).length;
  
  document.getElementById('hero-stats').innerHTML=`
    <div class="hero-stat"><div class="hero-stat-n">${n.length}</div><div class="hero-stat-l">Cupons</div></div>
    <div class="hero-stat"><div class="hero-stat-n">${maxD}%</div><div class="hero-stat-l">Maior OFF</div></div>
    ${hoje?`<div class="hero-stat"><div class="hero-stat-n" style="color:var(--red)">${hoje}</div><div class="hero-stat-l">Fim hoje</div></div>`:''}
  `;
}

function render(){
  const v=COUPONS.filter(matches);
  document.getElementById('list').innerHTML=v.map(renderCard).join('');
  document.getElementById('empty').classList.toggle('show',v.length===0);
}

// SINCRONIZAÇÃO AUTOMÁTICA EM TEMPO REAL COM A FONTE
async function sincronizarFonte() {
  const URL_ORIGEM = "https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/";
  const proxies = [
    `https://corsproxy.io/?${encodeURIComponent(URL_ORIGEM)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(URL_ORIGEM)}`
  ];

  for (let url of proxies) {
    try {
      const res = await fetch(url, { signal: AbortSignal.timeout(3500) });
      if (res.ok) {
        const text = await res.text();
        const match = text.match(/const\s+COUPONS\s*=\s*(\[[\s\S]*?\]);/);
        if (match && match[1]) {
          const dadosAtualizados = JSON.parse(match[1]);
          if (dadosAtualizados.length > 0) {
            COUPONS = dadosAtualizados;
            document.getElementById('subtitulo-data').textContent = "● Sincronizado com a base oficial em tempo real";
            counts();
            render();
            break;
          }
        }
      }
    } catch(e) {
      // Caso a rede externa oscile, a página mantém a lista base carregada instantaneamente
    }
  }
}

// Filtros
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    af=b.dataset.f;
    render();
  });
});

document.getElementById('search').addEventListener('input',e=>{
  sq=e.target.value.trim();
  render();
});

// Inicialização imediata
counts();
render();
sincronizarFonte();
</script>
