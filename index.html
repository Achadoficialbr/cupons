<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cupons e Ofertas Mercado Livre | Achados Oficial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ml-yellow: #FFE600;
      --ml-blue: #2D3277;
      --ml-green: #00A650;
      --bg: #F4F5F7;
      --card-bg: #FFFFFF;
      --text: #222222;
      --text-muted: #666666;
      --border: #E2E4E8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }

    header { background-color: var(--ml-yellow); padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .header-content { max-width: 900px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 800; color: var(--ml-blue); text-decoration: none; }
    .logo span { color: #d60000; }
    
    .btn-wpp {
      background-color: #25D366; color: #fff; font-weight: 700; font-size: 0.85rem;
      padding: 9px 16px; border-radius: 20px; text-decoration: none; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 3px 8px rgba(37,211,102,0.25);
    }

    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }

    .hero { text-align: center; margin-bottom: 24px; }
    .hero h1 { font-size: 1.6rem; color: var(--ml-blue); margin-bottom: 6px; }
    .status-box {
      display: inline-flex; align-items: center; gap: 6px; background-color: #E8F7EE; color: var(--ml-green);
      font-size: 0.78rem; font-weight: 700; padding: 5px 14px; border-radius: 20px; margin-bottom: 12px;
    }

    .search-box {
      width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border);
      font-size: 0.95rem; margin-bottom: 16px; outline: none; background: #fff;
    }

    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
    .cat-btn {
      background: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap;
    }
    .cat-btn.active { background: var(--ml-blue); color: #fff; border-color: var(--ml-blue); }

    .cupons-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media(min-width: 650px) { .cupons-grid { grid-template-columns: 1fr 1fr; } }

    .cupom-card {
      background: var(--card-bg); border-radius: 16px; padding: 18px;
      border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 3px 8px rgba(0,0,0,0.02);
    }

    .tag-desconto {
      align-self: flex-start; background: #FFF4E5; color: #D96B00;
      font-weight: 800; font-size: 0.85rem; padding: 5px 12px; border-radius: 8px; margin-bottom: 8px;
    }
    .cupom-info h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }
    .cupom-info p { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4; margin-bottom: 16px; }

    .cupom-action {
      background: #F8F9FA; border: 2px dashed #D0D5DD; border-radius: 12px;
      display: flex; align-items: center; justify-content: space-between; padding: 6px 6px 6px 14px;
    }
    .cupom-code { font-weight: 800; font-size: 0.95rem; color: var(--ml-blue); letter-spacing: 1px; }
    .cupom-code.oculto { filter: blur(5px); user-select: none; }

    .btn-pegar {
      background-color: var(--ml-green); color: #fff; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s;
    }
    .btn-pegar.revelado { background-color: var(--ml-blue); }

    .loading-spinner {
      text-align: center; padding: 40px; color: var(--text-muted); font-size: 1rem;
    }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1F2937; color: #fff; padding: 12px 24px; border-radius: 30px;
      font-size: 0.88rem; font-weight: 600; display: none; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <a href="#" class="logo">Achados<span>Oficial</span></a>
      <a href="https://www.mercadolivre.com.br/social/achadoficial" target="_blank" class="btn-wpp" style="background:#2D3277;">
        Ver Perfil Oficial
      </a>
    </div>
  </header>

  <div class="container">
    <div class="hero">
      <div class="status-box" id="statusAtualizacao">● Conectando aos cupons em tempo real...</div>
      <h1>Cupons Mercado Livre</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Clique no cupom para copiar o código e acessar os produtos com desconto.</p>
    </div>

    <input type="text" id="buscaInput" class="search-box" placeholder="Buscar cupom por nome, categoria ou valor..." onkeyup="filtrarCupons()">

    <div id="loading" class="loading-spinner">Buscando os cupons mais recentes...</div>
    <div class="cupons-grid" id="listaCupons" style="display:none;"></div>
  </div>

  <div id="toast">Cupom copiado! Abrindo produtos com desconto...</div>

  <script>
    // CREDENCIAIS DE AFILIADO CONFIGURADAS
    const MATT_TOOL = "52184482";
    const MATT_WORD = "achadoficial";

    const URL_FONTE = "https://afiliadosmercadolivre.github.io/cupons-afiliadosmercadolivre/";
    const PROXY_URL = "https://api.allorigins.win/get?url=" + encodeURIComponent(URL_FONTE + "?t=" + new Date().getTime());

    let cuponsCarregados = [];

    // Função que anexa os parâmetros de afiliado em qualquer link de lista do Mercado Livre
    function transformarLinkAfiliado(urlOriginal) {
      if (!urlOriginal || urlOriginal === "#" || urlOriginal.startsWith("javascript")) {
        return `https://www.mercadolivre.com.br/cupons?matt_tool=${MATT_TOOL}&matt_word=${MATT_WORD}&forceInApp=true`;
      }
      
      try {
        const urlObj = new URL(urlOriginal);
        urlObj.searchParams.set("matt_tool", MATT_TOOL);
        urlObj.searchParams.set("matt_word", MATT_WORD);
        urlObj.searchParams.set("forceInApp", "true");
        return urlObj.toString();
      } catch (e) {
        const sep = urlOriginal.includes("?") ? "&" : "?";
        return `${urlOriginal}${sep}matt_tool=${MATT_TOOL}&matt_word=${MATT_WORD}&forceInApp=true`;
      }
    }

    async function buscarCuponsAoVivo() {
      try {
        const response = await fetch(PROXY_URL);
        const data = await response.json();
        const htmlTexto = data.contents;

        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlTexto, "text/html");

        // Pega a data/hora da última atualização da página original
        const headerInfo = doc.querySelector("header span");
        if (headerInfo) {
          document.getElementById("statusAtualizacao").innerText = "● " + headerInfo.innerText.trim();
        } else {
          document.getElementById("statusAtualizacao").innerText = "● Atualização automática ativa";
        }

        cuponsCarregados = [];
        let idCounter = 1;

        // Extrai todas as listas e cupons da página de origem
        const cardsFonte = doc.querySelectorAll(".cupom, .card, table tr, [data-cupom], div");
        
        doc.querySelectorAll("a").forEach(a => {
          const href = a.getAttribute("href") || "";
          if (href.includes("mercadolivre.com") || href.includes("meli.la") || href.includes("cupom")) {
            const containerTexto = a.closest("div") ? a.closest("div").innerText : a.innerText;
            
            // Procura código de cupom em destaque
            const regex = /[A-Z0-9_-]{4,20}/g;
            const matches = containerTexto.match(regex) || [];
            const codigo = matches.length > 0 ? matches[0] : "DESCONTO";

            // Evita duplicar o mesmo cupom na tela
            if (!cuponsCarregados.some(item => item.codigo === codigo && item.link === href)) {
              cuponsCarregados.push({
                id: idCounter++,
                codigo: codigo,
                titulo: a.innerText.trim() || "Produtos Selecionados com Desconto",
                regra: containerTexto.substring(0, 110).replace(codigo, "").trim(),
                desconto: "Cupom Ativo",
                linkAfiliado: transformarLinkAfiliado(href)
              });
            }
          }
        });

        // Caso a leitura dinâmica não traga itens suficientes, complementa com links diretos das principais categorias
        if (cuponsCarregados.length === 0) {
          cuponsCarregados = [
            {
              id: 1,
              codigo: "MELIEXTRA",
              titulo: "Seleção de Cupons Oficiais Mercado Livre",
              regra: "Descontos ativos em milhares de produtos participantes.",
              desconto: "Até 50% OFF",
              linkAfiliado: transformarLinkAfiliado("https://www.mercadolivre.com.br/cupons")
            },
            {
              id: 2,
              codigo: "OFERTASHOJE",
              titulo: "Ofertas do Dia com Frete Rápido",
              regra: "Produtos com preço reduzido e cupons automáticos na finalização.",
              desconto: "Super Preço",
              linkAfiliado: transformarLinkAfiliado("https://www.mercadolivre.com.br/ofertas")
            }
          ];
        }

        document.getElementById("loading").style.display = "none";
        document.getElementById("listaCupons").style.display = "grid";
        renderizarCupons(cuponsCarregados);

      } catch (erro) {
        console.error("Erro na busca de cupons:", erro);
        document.getElementById("loading").innerText = "Carregando cupons disponíveis...";
        renderizarCupons([
          {
            id: 1,
            codigo: "MELIEXTRA",
            titulo: "Cupons e Ofertas Selecionadas",
            regra: "Válido em produtos participantes no Mercado Livre.",
            desconto: "Até 30% OFF",
            linkAfiliado: transformarLinkAfiliado("https://www.mercadolivre.com.br/cupons")
          }
        ]);
      }
    }

    function renderizarCupons(lista) {
      const container = document.getElementById("listaCupons");
      container.innerHTML = "";

      if (lista.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#999; grid-column: 1/-1; padding: 30px;">Nenhum cupom encontrado para essa pesquisa.</p>`;
        return;
      }

      lista.forEach(c => {
        const card = document.createElement("div");
        card.className = "cupom-card";
        const codigoOculto = c.codigo.length > 3 ? c.codigo.substring(0, 3) + "••••" : "••••";

        card.innerHTML = `
          <div>
            <span class="tag-desconto">${c.desconto}</span>
            <div class="cupom-info">
              <h3>${c.titulo}</h3>
              <p>${c.regra || 'Clique para resgatar e ver os produtos participantes.'}</p>
            </div>
          </div>
          <div class="cupom-action">
            <span class="cupom-code oculto" id="code-${c.id}">${codigoOculto}</span>
            <button class="btn-pegar" id="btn-${c.id}" onclick="ativarCupom(${c.id}, '${c.codigo}', '${c.linkAfiliado}')">
              Pegar Cupom
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function ativarCupom(id, codigo, link) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(codigo);
      }

      const codeSpan = document.getElementById(`code-${id}`);
      codeSpan.innerText = codigo;
      codeSpan.classList.remove('oculto');

      const btn = document.getElementById(`btn-${id}`);
      btn.innerText = "Copiado! ✓";
      btn.classList.add('revelado');

      const toast = document.getElementById("toast");
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);

      // Abre a lista de produtos com suas credenciais de afiliado
      window.open(link, '_blank');
    }

    function filtrarCupons() {
      const termo = document.getElementById("buscaInput").value.toLowerCase();
      const filtrados = cuponsCarregados.filter(c => {
        return c.titulo.toLowerCase().includes(termo) || 
               c.codigo.toLowerCase().includes(termo) || 
               c.regra.toLowerCase().includes(termo);
      });
      renderizarCupons(filtrados);
    }

    // Carrega tudo dinamicamente ao abrir
    buscarCuponsAoVivo();
  </script>
</body>
</html>
